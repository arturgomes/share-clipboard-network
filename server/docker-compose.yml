
# ClipCascade server — runs on the Ubuntu desktop.
#
# NOTE: the Docker Hub image uses its own version line (0.x), separate from
# the GitHub release tags (3.x) the desktop clients are vendored from.
# 0.7.0 is the current server build (same digest as `latest` as of
# 2026-07-28, multi-arch: amd64/arm64/ppc64le/s390x) and is what the 3.2.0
# clients pair with. Tags: https://hub.docker.com/r/sathvikrao/clipcascade/tags
services:
  clipcascade:
    image: sathvikrao/clipcascade:0.7.0
    container_name: clipcascade
    ports:
      - "8080:8080"
    volumes:
      # H2 file-based database; persists users/config across container restarts.
      - ./cc_users:/database
    environment:
      # 1 MiB cap on a single clipboard message. Text-only v1 stays well
      # under this; raise if larger payloads are needed later.
      CC_MAX_MESSAGE_SIZE_IN_MiB: 1
    restart: unless-stopped
